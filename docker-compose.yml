services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.28.4
    container_name: cozy-cafe-pocketbase
    restart: unless-stopped
    # Image ENTRYPOINT already includes `serve ...`; override so we don't double it
    entrypoint: ["/usr/local/bin/pocketbase"]
    command:
      - serve
      - --http=0.0.0.0:8090
      - --dir=/pb_data
      - --migrationsDir=/pb_migrations
    ports:
      - "8090:8090"
    volumes:
      - ./pocketbase/pb_data:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_POCKETBASE_URL: ""
    container_name: cozy-cafe-web
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    ports:
      # 8080 is taken by Coolify/Traefik on the VPS
      - "3080:80"
