services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
    container_name: cozy-cafe-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-}
    volumes:
      # Persist DB only. Migrations live in the image (see Dockerfile.pocketbase).
      - ./pocketbase/pb_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_POCKETBASE_URL: ""
    container_name: cozy-cafe-web
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    ports:
      # 8080 is taken by Coolify/Traefik on the VPS
      - "3080:80"
