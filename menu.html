<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu — Cozy Cafe</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="description" content="Thoughtfully crafted provisions, baked fresh daily at Cozy Cafe." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Literata:opsz,wght@7..72,400..700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet" />
  </head>
  <body class="min-h-screen flex flex-col">
    <header id="site-header" class="w-full sticky top-0 shadow-sm bg-surface z-50"></header>

    <main class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-12 md:py-24">
      <div class="text-center mb-12 md:mb-24">
        <h1 class="font-display text-display-mobile md:text-display-lg text-primary mb-4">Our Menu</h1>
        <p class="font-body text-body-lg text-on-surface-variant max-w-2xl mx-auto">
          Thoughtfully crafted provisions, baked fresh daily. Enjoy our selection of warm pastries, hearty sandwiches, and comforting beverages.
        </p>
      </div>
      <div id="menu-root" aria-live="polite">
        <p class="text-on-surface-variant text-center">Loading menu…</p>
      </div>
    </main>

    <footer id="site-footer" class="w-full mt-auto border-t border-outline-variant bg-surface-container-highest"></footer>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/menu.js"></script>
  </body>
</html>
